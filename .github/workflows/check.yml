name: check

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n dropwizard-initializr.sh
      - name: Python syntax
        run: python3 -m py_compile initializr-ui/server.py
      - name: Catalog is valid JSON
        run: python3 -c "import json; json.load(open('initializr-ui/catalog.json'))"
